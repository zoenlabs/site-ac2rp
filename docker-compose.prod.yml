# Deploy em produção (VPS) — usa a imagem publicada no GHCR.
# Atualizar:  docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
services:
  ac2rp:
    image: ghcr.io/ac2rp/site-ac2rp:latest
    container_name: ac2rp-site
    ports:
      - "80:80"          # troque para "8080:80" se usar um reverse proxy na frente
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
